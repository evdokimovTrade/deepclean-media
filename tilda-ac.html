.acsum{margin:14px 0 0;border:1px dashed var(--line);border-radius:12px;padding:13px 14px;font-size:13.5px;color:var(--ink2);line-height:1.5;background:var(--mint)}
.acsum b{color:var(--ink)}
.freonnote{font-size:12px;color:var(--mut);margin:2px 2px 0;line-height:1.5}
/* отклик на нажатие и плавность выбора (apple-design §1, §10) */
.cta,.hbtn,[data-act]{transition:transform .12s ease,box-shadow .12s ease}
.cta:active,.hbtn:active,[data-act]:active{transform:scale(.975)}
.acopt{transition:transform .12s ease,border-color .16s ease,background-color .16s ease}
.acopt:active{transform:scale(.99)}
.lang button{transition:transform .12s ease,background-color .16s ease,color .16s ease}
.lang button:active{transform:scale(.93)}
.drawer a{transition:transform .12s ease}.drawer a:active{transform:scale(.98)}
.ba .kn{transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .14s ease}
.ba.grab .kn{transform:translate(-50%,-50%) scale(1.14);box-shadow:0 5px 18px rgba(0,0,0,.4)}
/* калькулятор карточками */
.acgrid{display:grid;grid-template-columns:1fr;gap:12px;margin:16px 0 0}
@media(min-width:480px){.acgrid{grid-template-columns:1fr 1fr}}
.accard{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;transition:transform .12s ease,border-color .16s ease,background-color .16s ease,box-shadow .16s ease}
.accard:active{transform:scale(.99)}
.accard.sel{border-color:var(--teal);background:var(--mint);box-shadow:0 6px 18px rgba(14,124,134,.14)}
.acnum{position:absolute;top:11px;right:11px;width:24px;height:24px;border-radius:8px;background:var(--teal);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;z-index:2}
.acph{border-radius:12px;overflow:hidden;background:#eef5f5;aspect-ratio:12/5;margin:0 0 11px}
.acph img{width:100%;height:100%;object-fit:cover;display:block}
.accard .svcic{width:46px;height:46px;border-radius:12px;background:var(--mint);display:grid;place-items:center;color:var(--teal);margin:0 0 10px}
.accard .svcic svg{width:26px;height:26px;stroke:var(--teal);fill:none;stroke-width:1.7}
.acname{font-weight:800;font-size:15px;color:var(--ink);line-height:1.25;padding-right:22px}
.acdesc{font-size:12.5px;color:var(--mut);margin:4px 0 0;line-height:1.35}
.acfoot{display:flex;align-items:center;justify-content:space-between;margin:12px 0 0}
.acprice{font-weight:800;font-size:15.5px;color:var(--teal-d);font-variant-numeric:tabular-nums;background:var(--mint);padding:8px 14px;border-radius:100px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.accard.sel .acprice{background:#fff}
.acchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background-color .16s ease,border-color .16s ease}
.acchk svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:opacity .16s ease}
.accard.sel .acchk{background:var(--teal);border-color:var(--teal)}
.accard.sel .acchk svg{opacity:1}
.actot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--mint)}
.actot .tl{font-size:13px;color:var(--ink2);font-weight:700}
.actot .tv{font-size:22px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
.actot.empty{background:var(--surface)}.actot.empty .tv{display:none}
.acnote{font-size:12px;color:var(--mut);margin:8px 2px 0;line-height:1.5}
.faqa{padding:0 16px 14px;font-size:13.5px;color:var(--ink2);line-height:1.5}.faqa ul{margin:0;padding-left:18px}.faqa li{margin:4px 0}.faqa p{margin:0}/* ===== Десктоп-адаптация (≥880px). Подключается последним, перекрывает мобильные правила. ===== */
@media(min-width:880px){
  .app{max-width:1120px;box-shadow:0 0 0 1px var(--line)}
  .hdr{padding:16px 40px}
  .brand{font-size:20px}

  /* hero как широкий баннер */
  .achero .hin{min-height:620px;padding:64px 56px 52px;align-items:flex-start}
  .achero .hey{font-size:12px}
  .achero h1{font-size:48px;line-height:1.08;max-width:18ch}
  .achero .sub{font-size:18px;max-width:52ch}
  .hbadges{grid-template-columns:repeat(4,1fr);gap:20px 22px;max-width:860px}
  .hbadge{font-size:13.5px}
  .hbtn{max-width:360px;font-size:17px}
  .hsocial span{font-size:14px}

  /* секции: шире отступы, читаемая ширина текста */
  section{padding:48px 56px 0}
  h2{font-size:32px}
  .lbl{font-size:12px}
  .lead{font-size:16px;max-width:72ch}

  /* до/после — по центру, с разумным потолком ширины */
  .baband{padding:40px 0 0}
  .baband .bahd{padding:0 56px}
  .ba{max-width:820px;margin-left:auto;margin-right:auto}
  .baband>div[style]{padding-left:56px!important;padding-right:56px!important}

  /* о нас — две колонки */
  .about2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}

  /* отзывы — ряд из трёх/четырёх карточек */
  .rev{flex-wrap:wrap;overflow:visible}
  .rev .rc{flex:0 0 calc(50% - 6px)}

  /* калькулятор уборки: типы 2 в ряд пошире, размеры 5 в ряд */
  .tgrid{grid-template-columns:1fr 1fr;max-width:820px}
  .seg[data-group="size"]{grid-template-columns:repeat(5,1fr)}
  .cout{max-width:560px}

  /* калькулятор услуг (AC/химчистка): карточки 3 в ряд */
  .acgrid{grid-template-columns:repeat(3,1fr)}
  .actot{max-width:none}

  /* другие услуги / контакты / финал */
  .osgrid{grid-template-columns:1fr 1fr;max-width:760px}
  #contacts .concta{max-width:420px}
  #contacts .cta{max-width:420px}
  .final{margin:48px 56px 0}
  .final .cta-final{padding:34px 40px}
  footer{padding:36px 56px 18px}

  /* нижняя панель WhatsApp/LINE — компактно по центру */
  .dock .in{max-width:520px}
}
@media(min-width:880px){
  /* чуть крупнее кликабельные карточки калькулятора на десктопе */
  .accard .acph{aspect-ratio:12/6}
}
