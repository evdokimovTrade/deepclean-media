<div id="dc-dry"></div>
<template id="dc-dry-tpl"><style>
:host{display:block;
    --bg:#EAF6F4; --surface:#FFFFFF; --mint:#DCEFEC; --mint2:#CFE6E1; --line:#E1EDEA;

  }
  
  
  *{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}

  button{font-family:inherit}a{color:inherit;text-decoration:none}

  .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

  .hero{padding:22px 16px 6px;background:linear-gradient(180deg,var(--mint),var(--surface) 86%)}
  .eye{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);background:var(--surface);border:1px solid var(--mint2);border-radius:100px;padding:6px 12px}

  .sub{color:var(--ink2);font-size:15px;line-height:1.45;margin:11px 0 0}
  .sub b{color:var(--ink);font-weight:700}
  .pricechip{display:inline-flex;align-items:baseline;gap:6px;margin:15px 0 0;background:var(--mint);border-radius:12px;padding:9px 14px}
  .pricechip .fr{font-size:13px;color:var(--mut);font-weight:600}.pricechip .n{font-size:22px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}

  .cta svg{width:21px;height:21px;flex:none}
  .proof{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 0 0}

  .proof .st{color:var(--amber);letter-spacing:1px}
  .proof svg{width:15px;height:15px;stroke:var(--grn);stroke-width:2.6;fill:none}

  section{padding:26px 16px 0}
  .lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d)}
  h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.01em;margin:7px 0 0;line-height:1.15}
  .lead{color:var(--ink2);font-size:14.5px;margin:9px 0 0;line-height:1.5}
  .lead b{color:var(--ink)}

  .dry{display:flex;flex-direction:column;margin:16px 0 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}

  .dr .p i{font-style:normal;font-weight:600;color:var(--mut);font-size:12px;white-space:normal;text-align:right}
  .pricenote{font-size:11.5px;color:var(--mut);line-height:1.5;margin:12px 2px 0;padding-top:11px;border-top:1px dashed var(--line)}

  .inc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}

  .ba{position:relative;margin:16px 0 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);height:220px;display:flex}
  .ba .h{flex:1;position:relative}

  .ba .b .tag{left:10px;background:var(--red)}.ba .a .tag{right:10px;background:var(--teal)}
  .note{font-size:11.5px;color:var(--mut);text-align:center;margin:8px 0 0}
  .rev{display:flex;gap:11px;margin:14px 0 0;overflow-x:auto;padding-bottom:4px}
  .rc{flex:0 0 82%;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
  .rc .rh{display:flex;align-items:center;gap:9px}.rc .rh i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--mint2),var(--teal))}
  .rc .rh b{font-size:13.5px}.rc .st{color:var(--amber);font-size:12px;letter-spacing:1px;margin:7px 0 4px}.rc p{font-size:13px;color:var(--ink2);margin:0;line-height:1.4}

  .steps{display:grid;grid-template-columns:1fr;gap:11px;margin:16px 0 0}
  .step{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .step .no{width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
  .step b{font-size:14.5px}.step p{margin:3px 0 0;font-size:13px;color:var(--ink2);line-height:1.4}

  .faq{margin:16px 0 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
  .faq details{border-bottom:1px solid var(--line)}.faq details:last-child{border-bottom:0}
  .faq summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";color:var(--teal);font-weight:800}
  .faq details[open] summary::after{content:"\2212"}
  .faq p{margin:0;padding:0 16px 14px;font-size:13.5px;color:var(--ink2);line-height:1.5}

  .final{margin:22px 16px 0}
  .cta-final{background:linear-gradient(135deg,var(--teal),var(--teal-d));border-radius:20px;padding:22px 18px;color:#fff}
  .cta-final h2{font-family:var(--serif);color:#fff;margin:0}
  .cta-final p{color:#fff;opacity:.92;font-size:13.5px;margin:8px 0 0}
  .ff{display:flex;flex-direction:column;gap:9px;margin:14px 0 0}
  .ff input{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-family:inherit;color:var(--ink)}
  .ff .send{background:#fff;color:var(--teal-d);font-weight:800;font-size:16px;border:0;border-radius:12px;padding:15px;cursor:pointer;display:flex;gap:9px;align-items:center;justify-content:center}
  .ff .send svg{width:20px;height:20px}

  footer{padding:24px 16px 10px;color:var(--mut);font-size:12px;line-height:1.6}footer b{color:var(--ink2)}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .dock .in{display:grid;grid-template-columns:2fr 1fr;gap:10px;width:100%;max-width:448px}
  .dock button{display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}
  .dock .wa{background:var(--wa);color:#fff}.dock .li{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .dock svg{width:20px;height:20px;flex:none}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);z-index:70;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  svg.waic circle{fill:var(--wa)}

  .q{margin:16px 0 0}
  .qlbl{font-size:13px;font-weight:800;color:var(--ink);margin:0 0 8px}
  .seg{display:grid;gap:8px}.seg.c2{grid-template-columns:1fr 1fr}
  .opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:12px;padding:12px 10px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:center}
  .opt[aria-pressed="true"]{border-color:var(--teal);background:var(--mint);color:var(--teal-d)}
  .cout{margin:16px 0 0;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
  .cout .top{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;padding:16px 18px}
  .cout .cap{font-size:12.5px;opacity:.9;font-weight:700}
  .cout .val{font-size:30px;font-weight:800;margin:4px 0 0;font-variant-numeric:tabular-nums}
  .cout .val small{font-size:14px;font-weight:600;opacity:.85}
  .cout .sum{padding:13px 18px;font-size:13px;color:var(--ink2);background:var(--surface);line-height:1.5}
  .cout .sum b{color:var(--ink)}
  .cdisc{display:inline-flex;align-items:center;gap:7px;margin:10px 2px 0;background:var(--mint);color:var(--teal-d);border-radius:100px;padding:6px 12px;font-size:12.5px;font-weight:800}
  .cdisc[hidden]{display:none}
  .req{display:flex;flex-direction:column;align-items:center;text-align:center;margin:16px 0 0;border:1px solid var(--line);border-radius:18px;padding:22px 18px;background:var(--surface)}
  .req .big{font-family:var(--serif);font-size:22px;color:var(--teal);font-weight:700}
  .req p{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.5}
  .brand .mk{background:transparent;border-radius:50%;overflow:hidden;width:34px;height:34px}
  .brand .mk img{width:100%;height:100%;object-fit:cover;display:block}
.hnav{display:flex;align-items:center;gap:10px}.burg{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}.ovl{position:fixed;inset:0;background:rgba(5,12,14,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}.ovl.open{opacity:1;pointer-events:auto}.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:84vw;z-index:60;background:var(--surface);border-left:1px solid var(--line);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:-18px 0 40px rgba(0,0,0,.14)}.drawer.open{opacity:1;visibility:visible}.drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.drawer .dh b{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-d);font-weight:800}.drawer .x{border:0;background:transparent;font-size:22px;color:var(--mut);cursor:pointer}.drawer a{color:var(--ink);text-decoration:none;font-size:16px;font-weight:700;padding:13px 12px;border-radius:12px}.drawer a:hover{background:var(--mint)}.drawer .dm{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:12px;border-top:1px solid var(--line)}.drawer .dm button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.hcall{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--teal);color:#fff;text-decoration:none;flex:none}
.hcall svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2}
.hcall .hnum{display:none;white-space:nowrap}
.drawer .dphone{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;padding:13px;border-radius:12px;background:var(--mint);color:var(--teal-d);font-weight:800;font-size:16px;text-decoration:none;font-variant-numeric:tabular-nums}
.drawer .dphone svg{width:18px;height:18px;stroke:var(--teal-d);fill:none;stroke-width:2.2}
.achero{position:relative;padding:0;margin:0;overflow:hidden;background:#0c1b24}
.achero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% center;display:block}
.achero .hsc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,27,.74) 0%,rgba(8,20,27,.42) 34%,rgba(8,20,27,.52) 64%,rgba(8,20,27,.9) 100%)}
.achero .hin{position:relative;padding:22px 18px 24px;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;gap:0}

.achero .hey svg{width:16px;height:16px;fill:none;stroke:#8fd3ec;stroke-width:1.8;flex:none}

.achero .sub{color:#d6e4ea;font-size:15px;line-height:1.45;margin:12px 0 0;max-width:32ch;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.hbadges{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin:22px 0 0}

.hbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:14px;padding:16px;margin:22px 0 0;font-size:16px;font-weight:800;color:#fff;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--teal-d));box-shadow:0 12px 26px rgba(14,124,134,.45)}

.hsocial .av img:first-child{margin-left:0}

/* галерея до/после */
.baband{padding:18px 0 0}
.baband .bahd{padding:0 16px}
.bagal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:12px 16px 4px;scrollbar-width:none}
.bagal::-webkit-scrollbar{display:none}
.bacard{flex:0 0 78%;scroll-snap-align:center;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:0 6px 18px rgba(14,124,134,.08)}
.bacard img{width:100%;height:auto;display:block}
.rc .rphoto{width:100%;height:132px;object-fit:cover;border-radius:12px;margin:0 0 10px;display:block}
.gcard{display:flex;align-items:center;gap:12px;margin:14px 0 0;border:1px solid var(--line);border-radius:16px;padding:13px 16px;background:var(--surface)}

.gcard .gr{display:flex;align-items:baseline;gap:8px}.gcard .gr b{font-size:20px;color:var(--ink)}.gcard .gr .st{color:var(--amber);letter-spacing:1px;font-size:13px}
.gcard .gc{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.abcard{border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin:14px 0 0;background:var(--surface)}

.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:flex;align-items:flex-start;gap:11px;padding:9px 0;color:var(--ink2);font-size:14.5px;line-height:1.4;border-top:1px solid var(--line)}
.wlist li:first-child{border-top:0;padding-top:0}
.wlist li svg{width:18px;height:18px;stroke:var(--teal);fill:none;stroke-width:2.8;flex:none;margin-top:1px}
.trust3{display:flex;flex-direction:column;gap:13px;margin:18px 2px 0;padding:17px 0 0;border-top:1px solid var(--line)}
.trust3 div{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--ink2)}
.trust3 svg{width:23px;height:23px;stroke:var(--teal);fill:none;stroke-width:1.7;flex:none}
/* отклик на нажатие (apple-design) */
.cta,.hbtn,[data-act]{transition:transform .12s ease,box-shadow .12s ease}
.cta:active,.hbtn:active,[data-act]:active{transform:scale(.975)}
.lang button{transition:transform .12s ease,background-color .16s ease,color .16s ease}
.lang button:active{transform:scale(.93)}
.drawer a{transition:transform .12s ease}.drawer a:active{transform:scale(.98)}
/* калькулятор карточками */
.acgrid{display:grid;grid-template-columns:1fr;gap:12px;margin:16px 0 0}

.acfoot{display:flex;align-items:center;justify-content:space-between;margin:12px 0 0}
.acprice{font-weight:800;font-size:15.5px;color:var(--teal-d);font-variant-numeric:tabular-nums;background:var(--mint);padding:8px 14px;border-radius:100px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.accard.sel .acprice{background:#fff}
.acchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background-color .16s ease,border-color .16s ease}
.acchk svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:opacity .16s ease}
.accard.sel .acchk{background:var(--teal);border-color:var(--teal)}
.accard.sel .acchk svg{opacity:1}
.actot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--mint)}
.actot .tl{font-size:13px;color:var(--ink2);font-weight:700}
.actot .tv{font-size:22px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
.actot.empty{background:var(--surface)}.actot.empty .tv{display:none}
.acnote{font-size:12px;color:var(--mut);margin:8px 2px 0;line-height:1.5}
.faqa{padding:0 16px 14px;font-size:13.5px;color:var(--ink2);line-height:1.5}.faqa ul{margin:0;padding-left:18px}.faqa li{margin:4px 0}.faqa p{margin:0}/* ===== Десктоп-версия (≥900px). Подключается последним, перекрывает мобильные правила. ===== */
@media(min-width:900px){
  .app{max-width:1500px;box-shadow:0 0 0 1px var(--line)}

  /* Шапка: крупный кликабельный номер вместо иконки */
  .hdr{padding:18px 44px}
  .brand{font-size:21px}
  .hnav{gap:16px}
  .hcall{width:auto;height:auto;padding:11px 18px;border-radius:100px;gap:9px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
  .hcall .hnum{display:inline}

  /* Hero — широкий баннер, контент слева */
  .achero .hin{min-height:620px;padding:72px 56px 56px;max-width:760px}
  .achero .hey{font-size:12.5px}
  .achero h1{font-size:52px;line-height:1.05;max-width:16ch}
  .achero .sub{font-size:19px;max-width:48ch}
  .hbadges{grid-template-columns:repeat(4,1fr);gap:22px;max-width:700px}
  .hbtn{max-width:340px;font-size:17px}
  .hsocial span{font-size:14px}

  /* Общие секции */
  section{padding:56px 56px 0}
  h2{font-size:34px;line-height:1.12}
  .lead{font-size:16.5px;max-width:72ch}

  /* До/после — по центру, крупно */
  .baband{padding:48px 0 0}
  .baband .bahd{padding:0 56px}
  .ba{max-width:900px;margin-left:auto;margin-right:auto}
  .baband>div[style]{padding-left:56px;padding-right:56px}

  /* «О нас» + Google/траст — две колонки (через :has, без правки разметки) */
  section:has(.abcard){display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:16px;align-items:start}
  section:has(.abcard)>.lbl,
  section:has(.abcard)>h2,
  section:has(.abcard)>.trust3{grid-column:1 / -1}
  .abcard{margin-top:0}
  .trust3{flex-direction:row;flex-wrap:wrap;gap:28px;margin-top:8px}

  /* Отзывы — все в один ряд (их 4) */
  .rev{flex-wrap:wrap;overflow:visible}
  .rev .rc{flex:0 0 calc(25% - 9px)}

  /* Калькулятор */
  .acgrid{grid-template-columns:repeat(3,1fr)}
  .tgrid{grid-template-columns:1fr 1fr}
  .seg[data-group="size"]{grid-template-columns:repeat(5,1fr)}
  .cout,.actot{max-width:none}
  #calc .cta{display:inline-flex;width:auto;min-width:300px;margin-right:12px}

  /* Другие услуги — две колонки на всю ширину */
  .osgrid{grid-template-columns:1fr 1fr}

  /* Контакты — горизонтально: текст слева, кнопки справа */
  #contacts{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;align-items:center}
  #contacts>.lbl,#contacts>h2{grid-column:1 / -1}
  #contacts .lead{margin-top:0}
  #contacts .concta{margin-top:0;max-width:420px}
  #contacts>.cta{max-width:420px;margin-top:0}

  /* Финал / футер */
  .final{margin:56px 56px 0}
  .final .cta-final{padding:40px 48px}
  footer{padding:40px 56px 22px}

  /* На десктопе нижняя плавающая панель не нужна — есть номер в шапке и кнопки в блоках */
  .dock{display:none}
  .app{padding-bottom:0}
}
</style>
